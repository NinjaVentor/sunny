# Scrape UAE jobs twice daily (06:00 + 18:00 UTC) and store data/jobs.json.
# The site serves this file first; Jobicy API is the fallback.
name: Scrape UAE Jobs

on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -U python-jobspy
      - run: python scripts/scrape_jobs.py
      - name: Commit fresh jobs data
        run: |
          git config user.name "jobs-bot"
          git config user.email "jobs-bot@users.noreply.github.com"
          git add data/jobs.json
          git diff --cached --quiet || git commit -m "Update UAE jobs data"
          git push

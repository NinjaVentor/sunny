# Update UAE fuel prices monthly (1st, 06:00 UTC — prices take effect on the 1st).
# Manual runs supported. Commits only when fuel.json actually changed.
name: Fuel Prices Monthly

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fuel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/update-fuel.mjs
      - name: Commit fresh fuel data
        run: |
          git config user.name "fuel-bot"
          git config user.email "fuel-bot@users.noreply.github.com"
          git add data/fuel.json
          git diff --cached --quiet || git commit -m "chore: fuel prices $(node -e "console.log(JSON.parse(require('fs').readFileSync('data/fuel.json','utf8')).month)")"
          git push
